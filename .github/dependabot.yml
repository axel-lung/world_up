version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Types follow the Node.js version of the Docker image.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint (through eslint-config-next) doesn't support TypeScript 7
      # yet: lint fails. Remove once it does (typescript-eslint issue #10940).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # The Android app: Android Gradle plugin, android-browser-helper, Gradle wrapper
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The specification fixes Node.js 22.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
