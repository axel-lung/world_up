name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: worldup
          POSTGRES_USER: worldup
          POSTGRES_PASSWORD: worldup
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U worldup -d worldup"
          --health-interval 5s
          --health-retries 10
      # The worker delivers here; the end-to-end tests read the e-mails back.
      mailpit:
        image: axllent/mailpit:v1.29
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgres://worldup:worldup@localhost:5432/worldup
      APP_URL: http://localhost:3000
      AUTH_SECRET: ci-only-secret-for-throwaway-test-databases
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      MAIL_FROM: World Up <no-reply@localhost>
      ADMIN_EMAIL: admin@example.test
      # Web Push, with a key pair for CI only: no real device ever subscribes with it
      VAPID_PUBLIC_KEY: BFOtmdkoFdLMOxntqobg-JiCunkpKCNfFakSXm7ZtzMQ8fkJ5KBEi4gG62QqYUAZ_r4a5T3Ae8JxX3skyaB-Ykg
      VAPID_PRIVATE_KEY: cmtO5ePXo-BjOri3XXX5oz-d_8uy_RM_BwAfbcpAa0U
      VAPID_SUBJECT: mailto:admin@example.test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Catalogue pipeline tests
        run: python3 -m unittest discover -s scripts
      - name: Schema changes come with a generated migration
        run: |
          npx drizzle-kit generate
          git status --porcelain drizzle
          test -z "$(git status --porcelain drizzle)"
      - run: npm run db:migrate
      - name: Database tests (catalogue import)
        run: npm run test:db
      - run: npm run build
      # Against the production build (`next start`), where the rate limits are on.
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # Same path as a deployment: build the image, migrate, then web turns healthy.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start the production stack
        run: |
          docker network create traefik
          cat > .env <<'EOF'
          APP_DOMAIN=ci.localhost
          APP_URL=https://ci.localhost
          POSTGRES_PASSWORD=ci
          DATABASE_URL=postgres://worldup:ci@worldup-db:5432/worldup
          AUTH_SECRET=ci-only-secret-for-throwaway-test-databases
          SMTP_HOST=localhost
          MAIL_FROM=World Up <no-reply@ci.localhost>
          VAPID_PUBLIC_KEY=BFOtmdkoFdLMOxntqobg-JiCunkpKCNfFakSXm7ZtzMQ8fkJ5KBEi4gG62QqYUAZ_r4a5T3Ae8JxX3skyaB-Ykg
          VAPID_PRIVATE_KEY=cmtO5ePXo-BjOri3XXX5oz-d_8uy_RM_BwAfbcpAa0U
          VAPID_SUBJECT=https://ci.localhost
          EOF
          docker compose up -d --build --wait --wait-timeout 180 worldup-web worldup-worker
      - name: Stack logs
        if: always()
        run: docker compose logs
