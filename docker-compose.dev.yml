# Local development only: the database that `npm run dev` and `npm run worker`
# reach from the host. Production and staging use docker-compose.yml.
name: worldup-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: worldup
      POSTGRES_USER: worldup
      POSTGRES_PASSWORD: worldup
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worldup -d worldup"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
